<div class="layout">
  <aside class="sidebar" aria-label="Navegación principal">
    <a class="brand" routerLink="/">
      <span class="mark">
        <svg viewBox="0 0 64 64" width="34" height="34" aria-hidden="true">
          <defs>
            <linearGradient id="brandGrad" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#22d3ee"/>
              <stop offset=".5" stop-color="#4f7dff"/>
              <stop offset="1" stop-color="#b45cf7"/>
            </linearGradient>
          </defs>
          <g fill="none" stroke="url(#brandGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M32 6 57 16 32 26 7 16Z"/>
            <path d="M17 23v5c0 3.6 6.7 6 15 6s15-2.4 15-6v-5"/>
            <path d="M9 51c6-7 16-8 23-3 7-5 17-4 23 3l-3.5 4c-5-6-13-6.6-19.5-2.6C25.5 48.4 17.5 49 12.5 55Z"/>
            <path d="M46 47c6-4 9-10 9-18"/>
            <path d="m49 34 6-6 6 7"/>
          </g>
        </svg>
      </span>
      <b class="brand-name">UniSpace</b>
    </a>

    <p class="workspace">MI ESPACIO</p>

    <nav>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" appHalo>
        <span class="ico">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </span>
        <span>Inicio</span>
      </a>
      <a routerLink="/courses" routerLinkActive="active" appHalo>
        <span class="ico">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </span>
        <span>Cursos</span>
      </a>
      <a routerLink="/tasks" routerLinkActive="active" appHalo>
        <span class="ico">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8.5 12 2.5 2.5L16 9"/></svg>
        </span>
        <span>Tareas</span>
      </a>
      <a routerLink="/notebooks" routerLinkActive="active" appHalo>
        <span class="ico">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
        </span>
        <span>Cuadernos</span>
      </a>
      <a routerLink="/calendar" routerLinkActive="active" appHalo>
        <span class="ico">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
        </span>
        <span>Calendario</span>
      </a>
      <a routerLink="/schedule" routerLinkActive="active" appHalo>
        <span class="ico">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        </span>
        <span>Horario</span>
      </a>
    </nav>

    <div class="profile-wrap" (click)="$event.stopPropagation()">
      @if (menuOpen) {
        <div class="account-menu">
          <a routerLink="/settings" (click)="menuOpen = false">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Configuración
          </a>
          <button class="danger" (click)="auth.signOut()">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
            Cerrar sesión
          </button>
        </div>
      }

      <button class="profile" [class.open]="menuOpen" (click)="toggleAccount($event)">
        <div class="avatar">{{ state.initials() }}</div>
        <div class="who">
          <strong>{{ state.profile().name }}</strong>
          <small>Estudiante</small>
        </div>
        <svg class="chev" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
      </button>
    </div>
  </aside>

  <main class="content"><ng-content /></main>
</div>
